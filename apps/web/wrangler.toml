# Reference Wrangler settings for manual deploys and `pnpm santa:publish:remote`.
# Vinext/CF Vite uses cloudflare.config.ts at build time; keep both in sync.
name = "santa-tracker"
main = "vinext/server/fetch-handler"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]

# Public tracker JSON is served from Static Assets (no Worker invocation).
# Do not set run_worker_first for /data/* or /tracker — see docs/DEPLOY.md.
[assets]
directory = "./.vinext/client"
binding = "ASSETS"
not_found_handling = "none"

[[r2_buckets]]
binding = "SANTA_SNAPSHOTS"
bucket_name = "santa-tracker-snapshots"

[vars]
ADVENT_ENABLED = "true"
SANTA_STORAGE_BACKEND = "r2"
# Set via `wrangler secret put`:
# - SECRET_KEY
# - ADMIN_PASSWORD
