version = 1

exclude_patterns = [
  "build/**",
  "server/release/**",
  "scripts/lib/production-release.test.mjs",
  "scripts/lib/github-paginate.test.mjs",
  "scripts/lib/pr-ci-label-state.test.mjs",
  "server/**/*.test.js",
  "src/**/*.test.ts",
  "src/**/*.test.tsx",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  cyclomatic_complexity_threshold = "critical"
  # Shared helpers are intentionally covered by expressive names and module-level docs;
  # require symbol comments only where they add behavior or contract context.
  skip_doc_coverage = [
    "function-declaration",
    "function-expression",
    "arrow-function-expression",
    "class-declaration",
    "class-expression",
    "method-definition",
  ]

  [analyzers.features]
  parse_test_files = false
