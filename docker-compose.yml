services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: santa_tracker
      POSTGRES_PASSWORD: santa
      POSTGRES_USER: santa
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U santa -d santa_tracker']
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - '5432:5432'
    volumes:
      - santa-tracker-postgres:/var/lib/postgresql/data

volumes:
  santa-tracker-postgres:
