name: PR governance

# PR routing labels, descriptive content labels, changelog status, and CI labels.
# Branch/changelog policy enforcement lives in ci.yml (required status checks).
# CI labels are additionally settled by pr-ci-label.yml when the CI workflow
# completes (GitHub Actions' own suites never emit check_suite events). This
# check_suite path stays for third-party suites, which do emit events, so
# failures surface early and stragglers that finish after CI are reconciled.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  check_suite:
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  labels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR branches
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: git fetch origin "$GITHUB_BASE_REF" "$GITHUB_HEAD_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Compute labels from branch and diff
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/compute-pr-labels.mjs > pr-labels.json

      - name: Apply PR labels
        uses: actions/github-script@v7
        env:
          COMPUTED_LABELS_PATH: pr-labels.json
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { LABEL_DEFS } = await import('./scripts/lib/pr-label-defs.mjs');
            const labelDefs = LABEL_DEFS;
            for (const [name, color] of labelDefs) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color });
                }
              }
            }

            const pr = context.payload.pull_request;
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number,
            });

            const computed = JSON.parse(
              fs.readFileSync(process.env.COMPUTED_LABELS_PATH ?? 'pr-labels.json', 'utf8'),
            );
            const contentManaged = computed.contentManaged ?? [];
            const desired = new Set(computed.labels ?? []);

            if (pull.mergeable === false) desired.add('has conflicts');
            if (pull.draft) desired.add('draft');

            const existing = (await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number: pr.number,
            })).data.map((label) => label.name);

            const safeRemoveLabel = async (name) => {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            for (const name of contentManaged) {
              if (existing.includes(name) && !desired.has(name)) {
                await safeRemoveLabel(name);
              }
            }

            const toAdd = [...desired].filter((name) => !existing.includes(name));
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: toAdd,
              });
            }

  refresh-labels:
    if: >-
      github.event_name == 'check_suite' &&
      github.event.check_suite.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Update CI labels from all check runs on PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRS_JSON: ${{ toJSON(github.event.check_suite.pull_requests) }}
        run: |
          PR_NUMBERS="$(printf '%s' "$PRS_JSON" | jq -r '.[].number' | paste -sd, -)"
          PR_NUMBERS="$PR_NUMBERS" node scripts/sync-pr-ci-label.mjs
