name: Legacy Beta Cycle Bump (disabled)

# Beta is no longer advanced by a post-production bump. main is the permanent
# next-major line, and beta releases are manually created from main snapshots.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-freeze-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the replacement
        run: |
          echo "The legacy beta cycle bump is disabled."
          echo "Create an explicit beta prerelease from main instead."
