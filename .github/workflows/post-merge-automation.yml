name: Post-merge automation (disabled during delivery migration)

# MIGRATION FREEZE:
# The previous workflow created GitHub Releases after merges. Those releases
# triggered deployment workflows, so leaving it active would make the migration
# unsafe. The replacement release workflows will be added in later stack layers.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-freeze-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the freeze
        run: |
          echo "Post-merge release automation is disabled during the GFC delivery migration."
          echo "Use an explicitly approved manual workflow only."
