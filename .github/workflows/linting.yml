name: Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  python-lint:
    runs-on: ubuntu-latest
    name: Python Linting
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      
      - name: Install Python linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Run Black
        run: |
          black --check --diff archive/flask-legacy
      
      - name: Run isort
        run: |
          isort --check-only --diff archive/flask-legacy
      
      - name: Run Flake8
        run: |
          flake8 --config archive/flask-legacy/.flake8 archive/flask-legacy
      
      - name: Check for print statements in src/
        run: |
          echo "Checking for print() statements in the archived Flask code..."
          # Find print statements in Python files under src/, excluding __pycache__
          # Use word boundary to avoid matching sprint(), blueprint(), etc.
          # Exclude comments (lines starting with #)
          if grep -rn '\bprint\s*(' archive/flask-legacy --include="*.py" | grep -v "__pycache__" | grep -v '^\s*#' | grep -v "# .*print"; then
            echo ""
            echo "❌ Error: Found print() statements in src/ directory."
            echo "Please use logging instead: import logging; logger = logging.getLogger(__name__)"
            exit 1
          fi
          echo "✓ No print() statements found in archive/flask-legacy/"

  javascript-lint:
    runs-on: ubuntu-latest
    name: JavaScript Linting

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  css-lint:
    runs-on: ubuntu-latest
    name: CSS Linting

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stylelint
        run: pnpm run lint:css

  html-lint:
    runs-on: ubuntu-latest
    name: HTML Linting

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run HTMLHint
        run: pnpm run lint:html

  lockfile-check:
    runs-on: ubuntu-latest
    name: Lockfile Validation

    steps:
      - uses: actions/checkout@v4

      - name: Check pnpm workspace lockfile exists
        run: |
          if [ ! -f "pnpm-lock.yaml" ]; then
            echo "Error: pnpm-lock.yaml is missing in the root directory"
            exit 1
          fi
          echo "✓ pnpm-lock.yaml found"

      - name: Check tools/route-editor package-lock.json exists
        run: |
          if [ ! -f "tools/route-editor/package-lock.json" ]; then
            echo "Error: package-lock.json is missing in tools/route-editor"
            exit 1
          fi
          echo "✓ tools/route-editor/package-lock.json found"
