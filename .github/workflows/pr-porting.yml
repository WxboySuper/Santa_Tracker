name: PR porting (disabled during delivery migration)

# MIGRATION FREEZE:
# The old workflow ported main → beta. That direction is no longer authoritative
# once main becomes the next-major line. A stable → main forward-port workflow will
# be added after the stable release line and cutover rules are in place.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-freeze-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the freeze
        run: |
          echo "The legacy main-to-beta porting workflow is disabled during migration."
          echo "No automatic branch port was performed."
