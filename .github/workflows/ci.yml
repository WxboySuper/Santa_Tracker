name: CI

on:
  push:
    branches: [main, 'stable/**']
  pull_request:

concurrency:
  group: changelog-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-governance:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Fetch PR branches
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: git fetch origin "$GITHUB_BASE_REF" "$GITHUB_HEAD_REF"

      - name: Prepare automated changelog metadata
        if: >-
          (github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'dependabot/')) ||
          startsWith(github.head_ref, 'port/')
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-changelog-governance.mjs

      - name: Refresh PR head after automated preparation
        if: >-
          (github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'dependabot/')) ||
          startsWith(github.head_ref, 'port/')
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: git fetch origin "$GITHUB_HEAD_REF"

      - name: Branch policy
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/validate-branch-policy.mjs

      - name: Port PR policy
        if: startsWith(github.head_ref, 'port/')
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/validate-port-pr-policy.mjs

      - name: Changelog policy
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-changelog-pr.mjs

      - name: Stable release-line policy
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/validate-production-release-pr.mjs

      - name: Stable hotfix version and file policy
        if: startsWith(github.base_ref, 'stable/')
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/validate-stable-hotfix-pr.mjs

  package-version-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release automation unit tests
        run: node --test scripts/create-github-release.test.mjs scripts/lib/*.test.mjs scripts/lib/license-policy.test.mjs

      - name: Validate package version for target branch
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/validate-package-version.mjs

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application source
        run: pnpm run typecheck

      - name: Typecheck regression check for test sources
        run: pnpm run typecheck:test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint application source and tests
        run: pnpm run lint

  feature-exposure-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate feature exposure policy
        run: pnpm run validate:feature-exposure

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Setup Java for the Firestore Emulator
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run hostile-client Firestore rules tests
        run: pnpm test:firestore-rules

  license-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce third-party license policy
        run: |
          node scripts/check-third-party-licenses.mjs
          git diff --exit-code THIRD_PARTY_NOTICES.md || {
            echo "::error::THIRD_PARTY_NOTICES.md is stale. Run pnpm licenses:generate and commit it."
            exit 1
          }

  build-and-test:
    needs: [package-version-policy, pr-governance]
    if: >-
      always() &&
      needs.package-version-policy.result == 'success' &&
      (needs.pr-governance.result == 'success' || needs.pr-governance.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          CI: false
          VITE_BUILD_TARGET: local

      - name: Run tests
        run: pnpm test --silent
        env:
          CI: true

      - name: Run analytics server tests
        working-directory: server
        run: |
          if node -e "const s=require('./package.json').scripts; process.exit(s && s.test ? 0 : 1)"; then
            npm ci
            npm test
          else
            echo "Skipping server tests: no test script in server/package.json on this branch."
          fi

  e2e:
    needs: [typecheck, feature-exposure-policy, lint]
    if: >-
      always() &&
      needs.typecheck.result == 'success' &&
      needs.feature-exposure-policy.result == 'success' &&
      needs.lint.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm run test:e2e
