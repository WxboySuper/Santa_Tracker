name: Create Stable Release

# Stable releases are created only from an approved stable/* release line.
# The published release then activates the production deployment workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Stable branch, tag, or commit to release'
        required: true
        default: stable/1.6.x
        type: string
      confirmation:
        description: 'Type RELEASE-STABLE to create the production release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.ref }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "$CONFIRMATION" != "RELEASE-STABLE" ]; then
            echo "::error::Type RELEASE-STABLE to create a production release."
            exit 1
          fi

      - name: Checkout release ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Validate stable release ref and package version
        run: |
          set -euo pipefail
          case "$RELEASE_REF" in
            stable/*) ;;
            *) echo "::error::Stable releases must come from stable/*, got $RELEASE_REF" >&2; exit 1 ;;
          esac
          VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s' "$VERSION" | grep -Eq -- '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Stable release requires a stable semver package version, got $VERSION" >&2
            exit 1
          fi
          echo "Releasing stable version $VERSION from $RELEASE_REF"

      - name: Create GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_FILE: CHANGELOG.md
          NOTES_FILE: stable-release-notes.md
        run: node scripts/create-github-release.mjs "$(node -p "require('./package.json').version")" "$RELEASE_REF"
