name: Bundle budgets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # PR-head build code gets no token or secrets. Budget limits are loaded from the base commit below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load trusted bundle budgets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          trusted_config=".base/tools/bundle-budget.config.json"
          pr_config="tools/bundle-budget.config.json"
          if test -f "$trusted_config"; then
            if ! cmp -s "$trusted_config" "$pr_config"; then
              echo "::warning::This PR changes tools/bundle-budget.config.json. The check still uses the base limits. An application owner must approve any budget increase."
            fi
            cp "$trusted_config" "$pr_config"
            echo "::notice::Bundle limits loaded from the target base commit."
          else
            added=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- tools/bundle-budget.config.json | awk '$1 == "A" && $2 == "tools/bundle-budget.config.json" { found=1 } END { print found+0 }')
            if test "$added" != "1" || ! test -f "$pr_config"; then
              echo "::error::No trusted config in base, and this PR does not add tools/bundle-budget.config.json. Failing closed."
              exit 1
            fi
            echo "::notice::One-time bootstrap run: this PR adds the bundle budget config, so the new config is used for this measurement."
          fi
      - name: Build client bundles
        working-directory: apps/web
        env:
          VINEXT_BUILD: '1'
          SECRET_KEY: bundle-budget-ci-secret
          ADMIN_PASSWORD: bundle-budget-ci-admin
        run: pnpm exec vite build
      - name: Check bundle budgets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUNDLE_BUDGET_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if test -f .base/tools/bundle-budget.mjs; then
            node .base/tools/bundle-budget.mjs
          else
            added=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- tools/bundle-budget.mjs | awk '$1 == "A" && $2 == "tools/bundle-budget.mjs" { found=1 } END { print found+0 }')
            if test "$added" != "1" || ! test -f tools/bundle-budget.mjs; then
              echo "::error::No trusted checker in base, and this PR does not add tools/bundle-budget.mjs. Failing closed."
              exit 1
            fi
            echo "::notice::One-time bootstrap run: this PR adds the bundle budget checker, so its checker is used for this measurement."
            node tools/bundle-budget.mjs
          fi
