name: Legacy Beta to Main Release Preparation (disabled)

# The old beta → main release-preparation flow is intentionally disabled. The
# replacement cutover is prepared from beta only after the stable production
# line has been bootstrapped and the new release workflows are installed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-freeze-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the replacement
        run: |
          echo "The legacy beta-to-main release preparation workflow is disabled."
          echo "Use Prepare Main Next-Major Cutover after reviewing the migration stack."
