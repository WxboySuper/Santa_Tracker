name: PR hygiene

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check for a trusted gate script
        id: gate
        run: |
          if test -f tools/pr-hygiene.mjs; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check PR title and changelog
        if: steps.gate.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/pr-hygiene.mjs
      - name: Explain bootstrap skip
        if: steps.gate.outputs.available != 'true'
        run: echo "::notice::The trusted PR hygiene script is not present in the target branch yet. This bootstrap PR skips the gate; later PRs run the base-branch script."
