name: PR hygiene

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check for a trusted gate script
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if test -f tools/pr-hygiene.mjs; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const files = [];
          for (let page = 1; ; page += 1) {
            const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}/files?per_page=100&page=${page}`;
            const response = await fetch(url, { headers: { accept: 'application/vnd.github+json', authorization: `Bearer ${process.env.GITHUB_TOKEN}`, 'x-github-api-version': '2022-11-28' } });
            if (!response.ok) throw new Error(`GitHub API could not list PR files (${response.status} ${response.statusText})`);
            const pageFiles = await response.json();
            files.push(...pageFiles);
            if (pageFiles.length < 100) break;
          }

          if (!files.some((file) => file.filename === 'tools/pr-hygiene.mjs' && file.status === 'added')) {
            console.error('::error::No trusted PR hygiene script in base, and this PR does not add tools/pr-hygiene.mjs. Failing closed.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'available=false\nbootstrap=true\n');
          console.log('::notice::One-time bootstrap run: this PR adds tools/pr-hygiene.mjs. The gate will run from the trusted base after merge.');
          NODE
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check PR title and changelog
        if: steps.gate.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/pr-hygiene.mjs
      - name: Explain bootstrap skip
        if: steps.gate.outputs.bootstrap == 'true'
        run: echo "PR title and changelog checks are skipped for this one-time bootstrap PR."
