name: Legacy Direct Beta to Main Promotion (disabled)

# Direct beta → main promotion is unsafe once main becomes the next-major line
# and production is maintained on stable/X.Y.x. Keep this visible as a disabled
# workflow so old Actions links explain the new process instead of merging refs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-freeze-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the replacement
        run: |
          echo "Direct beta-to-main promotion is disabled."
          echo "Production releases must use stable/* and the manual stable release workflow."
