name: Prepare Main Next-Major Cutover

# This creates a reviewable beta → main cutover PR only after the stable
# production line exists. It does not merge, delete beta, or deploy anything.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Current next-major source branch'
        required: true
        default: beta
        type: string
      cutover_branch:
        description: 'Temporary branch for the cutover PR'
        required: true
        default: migration/main-next-major-cutover
        type: string
      confirmation:
        description: 'Type PREPARE-MAIN-CUTOVER to open the draft PR'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      CUTOVER_BRANCH: ${{ inputs.cutover_branch }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "$CONFIRMATION" != "PREPARE-MAIN-CUTOVER" ]; then
            echo "::error::Type PREPARE-MAIN-CUTOVER to open the cutover PR."
            exit 1
          fi
          if ! printf '%s' "$CUTOVER_BRANCH" | grep -Eq '^migration/[A-Za-z0-9._/-]+$'; then
            echo "::error::Cutover branch must be under migration/." >&2
            exit 1
          fi

      - name: Checkout source branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Create cutover branch and draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main "$SOURCE_REF"
          if git ls-remote --exit-code origin "refs/heads/$CUTOVER_BRANCH" >/dev/null 2>&1; then
            echo "::error::Cutover branch $CUTOVER_BRANCH already exists; refusing to move it." >&2
            exit 1
          fi
          git switch --create "$CUTOVER_BRANCH" "origin/$SOURCE_REF"
          git push --set-upstream origin "$CUTOVER_BRANCH"

          BODY=$(cat <<EOF
          ## Summary

          Make \\`main\\` the next-major integration line by reviewing the current \\`$SOURCE_REF\\` contents as a single intentional cutover.

          This PR must preserve the migration workflows already on \\`main\\`, resolve application conflicts explicitly, and remove beta-only integration assumptions. It does not deploy or delete \\`beta\\`.

          ### Before merge
          - Confirm the stable production branch (for example \\`stable/1.6.x\\`) exists and is protected.
          - Resolve workflow conflicts in favor of the new manual release/porting model.
          - Confirm production fixes have forward-port PRs or documented not-applicable decisions.
          - Run the full CI and staging rehearsal.

          Changelog-Impact: beta
          EOF
          )
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$CUTOVER_BRANCH" \
            --draft \
            --title "migration: make main the next-major line" \
            --body "$BODY"
