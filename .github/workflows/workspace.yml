name: Workspace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    name: Typecheck / Lint / Test / Build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: santa
          POSTGRES_PASSWORD: santa
          POSTGRES_DB: santa_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santa -d santa_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        env:
          DATABASE_URL_TEST: postgresql://santa:santa@localhost:5432/santa_tracker_test
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Verify single-command install
        run: |
          rm -rf node_modules apps/web/node_modules packages/*/node_modules
          pnpm install --frozen-lockfile
          echo "✓ Fresh clone installs with one pnpm command"

  dependency-rules:
    runs-on: ubuntu-latest
    name: Workspace dependency rules
    steps:
      - uses: actions/checkout@v4

      - name: Enforce ADR 0001 dependency direction
        run: |
          echo "Checking that forbidden imports are absent..."
          # contracts must not import from database, ui, route-engine, activity-sdk, config, next, react
          if grep -R "from '@santa-tracker/database'" packages/contracts --include="*.ts"; then echo "contracts must not import database"; exit 1; fi
          if grep -R "from '@santa-tracker/ui'" packages/contracts --include="*.ts"; then echo "contracts must not import ui"; exit 1; fi
          # route-engine must not import next, react, drizzle, database
          if grep -R "from 'next" packages/route-engine --include="*.ts"; then echo "route-engine must not import next"; exit 1; fi
          if grep -R "from 'react" packages/route-engine --include="*.ts"; then echo "route-engine must not import react"; exit 1; fi
          if grep -R "drizzle" packages/route-engine --include="*.ts"; then echo "route-engine must not import drizzle"; exit 1; fi
          # ui must not import database
          if grep -R "from '@santa-tracker/database'" packages/ui --include="*.ts" --include="*.tsx"; then echo "ui must not import database"; exit 1; fi
          # config must not import feature packages
          if grep -R "from '@santa-tracker/ui'" packages/config --include="*.ts"; then echo "config must not import ui"; exit 1; fi
          if grep -R "from '@santa-tracker/route-engine'" packages/config --include="*.ts"; then echo "config must not import route-engine"; exit 1; fi
          echo "✓ Dependency rules pass (ADR 0001)"
