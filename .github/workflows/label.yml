name: Labeler
on: [pull_request_target]

jobs:
  label:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v7 # Uploads repository content to the runner
    - uses: actions/labeler@v7
      with:
        configuration-path: '.github/labeler.yml'