name: Deploy Cloudflare Workers (manual)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare Workers environment
        required: false
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish route and Advent snapshots to R2
        run: pnpm santa:publish:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SANTA_R2_BUCKET: santa-tracker-snapshots

      - name: Build vinext Worker bundle
        run: pnpm --filter @santa-tracker/web build:vinext
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADVENT_ENABLED: "true"

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter @santa-tracker/web deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADVENT_ENABLED: "true"
