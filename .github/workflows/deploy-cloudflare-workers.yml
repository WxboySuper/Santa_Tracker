name: Deploy Cloudflare Workers (manual)

permissions:
  contents: read

on:
  # Auto-deploy to the Cloudflare Worker while the site is in development. Only changes that
  # can affect the deployed Worker trigger it (docs, tests and CI-only edits do not).
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'tools/santa-publish.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-cloudflare-workers.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare Workers environment
        required: false
        default: production
      activate_dataset:
        description: >-
          Replace the LIVE data for one dataset from the checked-in file (normal deploys never do this,
          because they keep whatever is live). The previous version stays in R2 for rollback.
        required: false
        type: choice
        default: none
        options:
          - none
          - advent-calendar
          - santa-route

# Serialize deploys; a newer push waits rather than cancelling a deploy mid-upload.
concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish route and Advent snapshots to R2
        run: pnpm santa:publish:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SANTA_R2_BUCKET: santa-tracker-snapshots

      - name: Replace live data from the checked-in file (manual, opt-in)
        if: ${{ inputs.activate_dataset != '' && inputs.activate_dataset != 'none' }}
        run: node tools/santa-publish.mjs --remote --activate --only "$DATASET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SANTA_R2_BUCKET: santa-tracker-snapshots
          DATASET: ${{ inputs.activate_dataset }}

      - name: Build vinext Worker bundle
        run: pnpm --filter @santa-tracker/web build:vinext
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADVENT_ENABLED: "true"

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter @santa-tracker/web deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADVENT_ENABLED: "true"

      # The Worker reads SECRET_KEY (JWT signing) and ADMIN_PASSWORD at runtime. Passing them as
      # env vars above only reaches the build; they must be uploaded as Worker secrets or
      # /admin reports "Admin access not configured". Re-sync on every deploy.
      - name: Sync Worker secrets
        working-directory: apps/web
        run: |
          for name in SECRET_KEY ADMIN_PASSWORD; do
            value="${!name}"
            if [[ -z "$value" ]]; then
              echo "::error::GitHub secret $name is empty or missing"
              exit 1
            fi
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --name santa-tracker
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Smoke test deployed Worker
        # Test the public hostname visitors use. The first run after a DNS change can hit a
        # resolver that still caches the old record, so retry once before failing.
        run: |
          node tools/smoke-test.mjs https://santa.weatherboysuper.com             || { sleep 30; node tools/smoke-test.mjs https://santa.weatherboysuper.com; }
        env:
          # /tracker and /advent are hidden from visitors outside their season windows, so the
          # test logs in as admin to verify the real data. Value comes from the existing secret.
          SMOKE_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
