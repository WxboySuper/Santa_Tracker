name: PR CI label

# GitHub Actions' own check suites never emit check_suite events, so the
# ci:pending/ci:passing/ci:failing label could only ever reflect an in-flight
# state. This workflow reacts to the CI workflow itself completing so the label
# settles on the final result. It never checks out a pull request head: the sync
# script only talks to the GitHub API and runs from the default branch.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  refresh-ci-label:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Update CI labels from all check runs on PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          PR_NUMBERS="$(printf '%s' "$PRS_JSON" | jq -r '.[].number' | paste -sd, -)"
          PR_NUMBERS="$PR_NUMBERS" node scripts/sync-pr-ci-label.mjs
