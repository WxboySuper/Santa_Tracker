# Dependabot version updates target main, the next-major integration line.
# Minor and patch updates share one PR. Major updates stay individual so
# migrations can be handled when there is time to review them.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      app-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /server
    target-branch: main
    schedule:
      interval: weekly
    groups:
      server-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
