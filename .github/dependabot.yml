version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "WxboySuper"
    groups:
      python-packages:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "WxboySuper"
    groups:
      npm-workspace:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/tools/route-editor"
    schedule:
      interval: "weekly"
    reviewers:
      - "WxboySuper"
    groups:
      route-editor-packages:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
