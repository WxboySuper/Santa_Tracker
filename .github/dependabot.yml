# Dependabot version updates target main, the next-major integration line.
# https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/configuring-multi-ecosystem-updates

version: 2

multi-ecosystem-groups:
  npm-main:
    target-branch: main
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: npm-main

  - package-ecosystem: npm
    directory: /server
    patterns:
      - "*"
    multi-ecosystem-group: npm-main
